name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Correr pruebas con cobertura
        working-directory: backend
        run: npm test

  deploy:
    name: Desplegar a Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  zap-scan:
    name: Escaneo de seguridad OWASP ZAP
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_URL: https://linkfree-backend.onrender.com/api/health
    steps:
      - name: Esperar a que Render termine el despliegue
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "El servicio no respondió 200 a tiempo, se escaneará de todos modos."

      - name: Escanear con OWASP ZAP
        continue-on-error: true
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET_URL" -a \
            -r report_html.html -w report_md.md -J report_json.json

      - name: Subir reporte ZAP como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: zap-reports/
          if-no-files-found: warn

  sonarcloud:
    name: Análisis con SonarCloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Generar cobertura
        working-directory: backend
        run: npm test

      - name: Escanear con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}