name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Correr pruebas con cobertura
        working-directory: backend
        run: npm test

  deploy:
    name: Desplegar a Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
  
    zap-scan:
    name: Escaneo de seguridad OWASP ZAP
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que Render despierte
        run: sleep 30

      - name: Escanear con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://linkfree-backend.onrender.com'
          cmd_options: '-a'